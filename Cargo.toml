[package]
name = "sonaraim-protocol"
version = "0.1.0"
edition = "2021"
description = "Core wire contracts, Sealed Sender envelope, and Sonaraim Card validator for the Sonaraim ecosystem"
license = "Apache-2.0"
repository = "https://github.com/alfonsodg/sonaraim-protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chacha20poly1305 = "0.10"
curve25519-dalek = "5.0.0"
ed25519-dalek = "3"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[features]
default = []
wasm = ["dep:wasm-bindgen"]
