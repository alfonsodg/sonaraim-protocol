[package]
name = "sonaraim-protocol"
version = "0.1.0"
edition = "2021"
description = "Core wire contracts, Sealed Sender envelope, and Sonaraim Card validator for the Sonaraim ecosystem"
license = "Apache-2.0"
repository = "https://github.com/alfonsodg/sonaraim-protocol"

[dependencies]
chacha20poly1305 = "0.10"
ed25519-dalek = "3"
getrandom = "0.2"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"
